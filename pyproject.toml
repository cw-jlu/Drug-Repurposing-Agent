[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drug-repurposing-agent"
version = "0.1.0"
description = "Auditable transcriptomic drug repurposing workflow"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "scikit-learn>=1.3"]
lincs = ["h5py>=3.10"]

[project.scripts]
drug-agent = "drug_repurposing_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
